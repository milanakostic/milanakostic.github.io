<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="{{ site.description | strip_html | normalize_whitespace }}">
    <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
  </head>
  <body>
    <div class="site-shell">
      <header class="site-header{% if page.url == '/' %} site-header--home{% endif %}">
        {% unless page.url == "/" %}
          <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.title }}</a>
        {% endunless %}
        <nav aria-label="Primary navigation">
          <a href="{{ '/' | relative_url }}#research">Research</a>
          <a href="{{ '/' | relative_url }}#teaching">Teaching</a>
          <a href="{{ '/' | relative_url }}#service">Service</a>
        </nav>
      </header>
      <main>{{ content }}</main>
      <footer class="site-footer">
        {% if site.github_username %}<a href="https://github.com/{{ site.github_username }}">GitHub</a>{% endif %}
      </footer>
    </div>
  </body>
</html>
